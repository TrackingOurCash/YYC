name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump
          UA="Mozilla/5.0 (compatible; TrackingOurCash-YYC/0.1; +https://github.com/TrackingOurCash/YYC)"
          curl -sSL -A "$UA" https://calgary.ca/our-finances/civic-partners-funding.html -o dump/civic.html
          curl -sSL -A "$UA" https://www.calgary.ca/social-services/funding/organization-allocations.html -o dump/fcss.html
          curl -sSL -A "$UA" https://www.calgary.ca/service-lines/budget-overview.html -o dump/budget.html
          curl -sSL -A "$UA" "https://www.calgary.ca/our-finances/2026-budget.html" -o dump/budget2026.html
          curl -sSL -A "$UA" "https://data.calgary.ca/api/catalog/v1?domains=data.calgary.ca&limit=500" -o dump/catalog.json
          ls -la dump
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add dump; git commit -m "dump [skip ci]"; git push

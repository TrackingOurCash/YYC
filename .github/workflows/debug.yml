name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y poppler-utils >/dev/null
          python .github/scripts/dump7.py
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add dump7; git commit -m "dump7 [skip ci]"; git push

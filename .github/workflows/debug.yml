name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: |
          python collectors/votes.py > votes_stats.txt
          python - >> votes_stats.txt <<'PY'
          import csv, collections
          m = list(csv.DictReader(open("data/votes/motions.csv")))
          b = list(csv.DictReader(open("data/votes/ballots.csv")))
          per = collections.defaultdict(collections.Counter)
          for x in b: per[x["motion_id"]][x["vote"]] += 1
          sizes = collections.Counter(sum(c.values()) for c in per.values())
          print("ballots per motion", sorted(sizes.items())[:40])
          print(collections.Counter(x["meeting_type"] for x in m).most_common())
          PY
          ls -la data/votes
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add votes_stats.txt data/votes; git commit -m "votes test [skip ci]"; git push

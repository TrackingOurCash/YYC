name: Collect Calgary data

on:
  schedule:
    - cron: "0 13 * * *" # 7:00 Calgary time (MDT) / 6:00 (MST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Job postings
        run: python collectors/jobs.py
      - name: Budget (Open Calgary)
        run: python collectors/budget.py
      - name: Council votes (Open Calgary)
        run: python collectors/votes.py
      - name: Salary list (Open Calgary)
        run: python collectors/compensation.py
      - name: Build dashboard data
        run: |
          python scripts/build_jobs_summary.py
          python scripts/build_budget.py
          python scripts/build_votes.py
      - name: Commit changes
        run: |
          git config user.name "yyc-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(date -u +%F)"
            git push
          fi

name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump2
          curl -sSL "https://data.calgary.ca/api/catalog/v1?domains=data.calgary.ca&limit=500&offset=500" -o dump2/catalog2.json
          for id in ruq3-99hx fqax-i3nz 9bze-mzx6 jd78-wxjp tz8z-hyaz n4di-6hi3; do
            curl -sSL "https://data.calgary.ca/api/views/$id.json" -o dump2/meta-$id.json
            curl -sSL "https://data.calgary.ca/resource/$id.json?\$limit=5" -o dump2/rows-$id.json
            curl -sSL "https://data.calgary.ca/resource/$id.json?\$select=count(*)" -o dump2/count-$id.json
          done
          ls -la dump2
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add dump2; git commit -m "dump2 [skip ci]"; git push

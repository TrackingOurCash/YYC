name: Backfill jobs from the Internet Archive

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Earliest capture date (YYYY-MM-DD)"
        default: "2026-01-01"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/backfill_jobs_from_archive.py --since "${{ inputs.since }}"
      - run: python scripts/build_jobs_summary.py
      - name: Commit changes
        run: |
          git config user.name "yyc-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Backfill job postings from the Internet Archive"
            git push
          fi

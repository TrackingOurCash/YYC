name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python .github/scripts/dump6.py
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add dump6; git commit -m "dump6 [skip ci]"; git push

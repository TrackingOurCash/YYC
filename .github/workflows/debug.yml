name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          bash .github/scripts/dump12.sh
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add dump13; git commit -m "dump13 [skip ci]"; git push

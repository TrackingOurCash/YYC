name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump5
          curl -sSL "https://data.calgary.ca/resource/9bze-mzx6.json?\$limit=50000&\$where=year>='2025'" -o dump5/comp.json
          ls -la dump5
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add dump5; git commit -m "dump5 [skip ci]"; git push

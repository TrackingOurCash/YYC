name: Collect Calgary data

on:
  schedule:
    - cron: "0 13 * * *" # 7:00 Calgary time (MDT) / 6:00 (MST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # a run queued behind another starts from that run's data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Each source runs through scripts/run_source.py: up to three tries, and if
      # they all fail, its last good data is put back and the run carries on with
      # a warning. The last step turns the run red once a source has failed three
      # runs in a row, since that usually means a page changed and needs a fix.
      - name: Job postings
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py jobs "City job postings" --keep data/jobs/postings.csv data/jobs/snapshots -- python collectors/jobs.py
      - name: Budget (Open Calgary)
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py budget "Budget (Open Calgary)" --keep data/budget -- python collectors/budget.py
      - name: Council votes (Open Calgary)
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py votes "Council votes (Open Calgary)" --keep data/votes/motions.csv data/votes/ballots.csv data/votes/dataset.json -- python collectors/votes.py
      - name: Council votes since the City's last update (meeting minutes)
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py votes_minutes "Council votes from meeting minutes" --keep data/votes/minutes_motions.csv data/votes/minutes_ballots.csv -- python collectors/votes_minutes.py
      - name: Salary list (Open Calgary)
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py compensation "Salary list (Open Calgary)" --keep data/jobs/compensation.csv -- python collectors/compensation.py
      - name: Civic Partners grants
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py grants_civic "Civic Partners grants" --keep data/grants -- python collectors/grants.py --only "Civic Partners"
      - name: FCSS grants
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py grants_fcss "FCSS grants" --keep data/grants -- python collectors/grants.py --only FCSS
      - name: Ward boundaries (Open Calgary)
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py ward_boundaries "Ward boundaries (Open Calgary)" --keep data/wards/ward_boundaries.geojson -- python collectors/ward_boundaries.py
      - name: Ward office budgets and expenses
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py ward_expenses "Ward office budgets and expenses" --keep data/wards/ward_budgets.csv data/wards/ward_expenses.csv -- python collectors/ward_expenses.py
      - name: City staff and payroll (annual reports and budget)
        if: ${{ !cancelled() }}
        run: python scripts/run_source.py workforce "City staff and payroll" --keep data/workforce -- python collectors/workforce.py
      - name: Build jobs data
        if: ${{ !cancelled() }}
        run: python scripts/build_jobs_summary.py
      - name: Build budget data
        if: ${{ !cancelled() }}
        run: python scripts/build_budget.py
      - name: Build votes data
        if: ${{ !cancelled() }}
        run: python scripts/build_votes.py
      - name: Build grants data
        if: ${{ !cancelled() }}
        run: python scripts/build_grants.py
      - name: Build wards data
        if: ${{ !cancelled() }}
        run: python scripts/build_wards.py
      - name: Build staff data
        if: ${{ !cancelled() }}
        run: python scripts/build_workforce.py
      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "yyc-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Data update $(date -u +%F)"
            # Someone may have pushed during the run; put the data on top.
            for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
            exit 1
          fi
      - name: Check for sources broken several runs in a row
        if: ${{ !cancelled() }}
        run: python scripts/check_sources.py

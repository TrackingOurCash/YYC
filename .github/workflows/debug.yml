name: debug
on:
  push:
    branches: [debug-detail]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dump3
          B=https://data.calgary.ca/resource
          curl -sSL "$B/fqax-i3nz.json?\$limit=5000" -o dump3/budget.json
          curl -sSL "$B/ruq3-99hx.json?\$select=meetingtype,count(*)&\$group=meetingtype&\$order=count(*)%20desc" -o dump3/votes-types.json
          curl -sSL "$B/ruq3-99hx.json?\$select=voter,count(*)&\$group=voter&\$order=count(*)%20desc&\$limit=200" -o dump3/votes-voters.json
          curl -sSL "$B/ruq3-99hx.json?\$select=min(meetingdate),max(meetingdate)" -o dump3/votes-range.json
          curl -sSL "$B/ruq3-99hx.json?\$where=meetingtype='Regular Meeting of Council'&\$order=meetingdate%20desc&\$limit=300" -o dump3/votes-recent.json
          curl -sSL "$B/ruq3-99hx.json?\$select=vote,count(*)&\$group=vote" -o dump3/votes-values.json
          ls -la dump3
          git config user.name dbg; git config user.email dbg@users.noreply.github.com
          git add dump3; git commit -m "dump3 [skip ci]"; git push
